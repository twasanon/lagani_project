name: lagani

services:
  api:
    platform: linux/amd64
    build:
      context: ./lagani_api
    image: lagani-api:local
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_FILE: /data/lagani_cache.db
      ADMIN_API_KEY: ${LAGANI_ADMIN_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${LAGANI_API_CORS_ALLOWED_ORIGINS:-http://localhost:8082}
      SCHEDULER_ENABLED: ${LAGANI_SCHEDULER_ENABLED:-false}
      STARTUP_JOBS_ENABLED: ${LAGANI_STARTUP_JOBS_ENABLED:-false}
    ports:
      - "${LAGANI_API_PORT:-8080}:8080"
    volumes:
      - lagani_api_data:/data
    stop_grace_period: 30s

  website:
    build:
      context: ./lagani_website
      args:
        NEXT_PUBLIC_SITE_URL: ${LAGANI_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_STORE_URL: ${LAGANI_APP_STORE_URL:-}
        NEXT_PUBLIC_PLAY_STORE_URL: ${LAGANI_PLAY_STORE_URL:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${LAGANI_SUPPORT_EMAIL:-}
    image: lagani-website:local
    restart: unless-stopped
    ports:
      - "${LAGANI_WEBSITE_PORT:-3000}:3000"
    stop_grace_period: 15s

volumes:
  lagani_api_data:
